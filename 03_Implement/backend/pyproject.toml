[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sui-sensemaking-backend"
version = "0.1.0"
# Deployment and CI both run Python 3.12. Older interpreters are not tested,
# so declare the tested floor instead of advertising untested compatibility.
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "cryptography",
  "fastapi<0.137",
  "httpx",
  "pydantic",
  "pydantic-settings",
  "pyjwt",
  "sqlalchemy",
  "uvicorn",
]

[project.optional-dependencies]
test = [
  "pytest",
  "httpx",
  "ruff==0.15.22",
  "python-multipart",
  "requests",
]
# SAAS-TENANT-01 AC-5: driver for `postgresql+psycopg` (see
# sui_sensemaking_api.db._normalize_database_url). Only needed to run the
# `postgres`-marked tests (README.md "tenant RLSの実地matrix"); not a
# runtime dependency of the app itself (production DB URL scheme is
# postgresql+asyncpg, normalized at import time).
postgres = [
  "psycopg[binary]",
]
mysql = [
  "pymysql>=1.1,<2",
]
mssql = [
  "pymssql>=2.3,<3",
]
cockroachdb = [
  "sqlalchemy-cockroachdb>=2.0,<3",
  "psycopg[binary]",
]
oracle = [
  "oracledb>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "-m", "not external_llm",
]
pythonpath = [
  "src",
]
markers = [
  "postgres: tests that require PostgreSQL",
  "mysql: tests that require MySQL or MariaDB",
  "mssql: tests that require Microsoft SQL Server",
  "cockroachdb: tests that require CockroachDB",
  "oracle: tests that require Oracle Database",
  "auth_level1: required AuthContext contract coverage",
  "auth_level2: conditional federation fixture coverage",
  "external_llm: tests that require any OpenAI-compatible adapter on port 8001",
]

[tool.ruff]
target-version = "py312"
line-length = 100
