name: cognitive-assoc-learned-sparse-gate-once

on:
  push:
    branches:
      - research/cognitive-assoc-01-learned-sparse-gate-20260919
    paths:
      - .github/workflows/cognitive-assoc-learned-sparse-gate-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify T5 gate and upstream synthetic contracts
        working-directory: 01_Plans/dogfood
        run: |
          python -m unittest -v \
            test_evaluate_cognitive_assoc_baselines.py \
            test_build_cognitive_assoc_learned_sparse_gate.py

      - name: Verify fixed v0 T5 artifacts do not exist
        run: |
          set -euo pipefail
          for file in \
            01_Plans/dogfood/cognitive-assoc-benchmark-v0-learned-sparse-gate-packet.json \
            01_Plans/dogfood/cognitive-assoc-benchmark-v0-learned-sparse-gate-response.json \
            01_Plans/dogfood/cognitive-assoc-benchmark-v0-learned-sparse-gate-decision.json \
            01_Plans/dogfood/cognitive-assoc-benchmark-v0-learned-sparse-gate-evidence.json
          do
            test ! -e "$file"
          done
          echo "FIXED_V0_T5_DECISION: NOT_EXECUTED"

      - name: Documentation and diff checks
        run: |
          set -euo pipefail
          git diff --check
          python 01_Plans/docs_check.py
