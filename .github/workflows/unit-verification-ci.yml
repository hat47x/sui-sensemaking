name: SUI 単体検証

# AI主体の開発で、人間のレビュー前に機械的な後退を止めるための最小ゲート。
# 対象をフロントエンドとバックエンドの単体・契約・代表e2eに限定し、
# フルe2eやSaaS多インスタンス検証は各専用ハーネスへ残す。
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/unit-verification-ci.yml'
      - '03_Implement/frontend/**'
      - '03_Implement/backend/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/unit-verification-ci.yml'
      - '03_Implement/frontend/**'
      - '03_Implement/backend/**'

permissions:
  contents: read

concurrency:
  group: sui-unit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 対象版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Python 3.12を用意
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: バックエンドの依存を導入
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: 型契約と判断履歴モデルを検証
        working-directory: 03_Implement/backend
        env:
          SUI_LLM_PROVIDER: none
        run: |
          python -m pytest -q \
            tests/test_ts_python_contract_drift.py \
            tests/test_critique_history_model.py

  frontend-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 対象版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js 22を用意
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: 依存を固定版で導入
        working-directory: 03_Implement/frontend
        run: npm ci --no-audit --no-fund

      - name: 型検査と単体テスト
        working-directory: 03_Implement/frontend
        run: |
          npm run typecheck
          npm test

      - name: 本番ビルド
        working-directory: 03_Implement/frontend
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 対象版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js 22を用意
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: 依存を固定版で導入
        working-directory: 03_Implement/frontend
        run: npm ci --no-audit --no-fund

      - name: Chromiumを用意
        working-directory: 03_Implement/frontend
        run: npx playwright install --with-deps chromium

      - name: 代表e2e
        working-directory: 03_Implement/frontend
        run: |
          npx playwright test \
            e2e/card_critique_history.spec.ts \
            e2e/card_critique_history_persistence.spec.ts \
            e2e/structure_decision_history.spec.ts \
            e2e/ce3_patch_workspace.spec.ts \
            --reporter=line
