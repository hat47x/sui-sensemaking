name: SUI native Action 契約・保存検証

# Issue #993: SUI所有の認証・保存とCanvas接続を検証する。
# 本CIは実APIのAction受付を有効化せず、TEI Hostとの本番接続を保証しない。
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-action-contract-ci.yml'
      - '03_Implement/backend/src/sui_sensemaking_api/routes/docs.py'
      - '03_Implement/backend/src/sui_sensemaking_api/card_move_command.py'
      - '03_Implement/backend/src/sui_sensemaking_api/database_content_store.py'
      - '03_Implement/backend/tests/test_card_move_command.py'
      - '03_Implement/backend/tests/test_docs_roundtrip.py'
      - '03_Implement/backend/tests/test_document_action_cas.py'
      - '03_Implement/backend/tests/test_request_body_safety.py'
      - '03_Implement/backend/tests/test_tenant_session_precondition.py'
      - '03_Implement/frontend/src/api/**'
      - '03_Implement/frontend/src/canvas/**'
      - '03_Implement/frontend/src/domain/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-action-contract-ci.yml'
      - '03_Implement/backend/src/sui_sensemaking_api/routes/docs.py'
      - '03_Implement/backend/src/sui_sensemaking_api/card_move_command.py'
      - '03_Implement/backend/src/sui_sensemaking_api/database_content_store.py'
      - '03_Implement/backend/tests/test_card_move_command.py'
      - '03_Implement/backend/tests/test_docs_roundtrip.py'
      - '03_Implement/backend/tests/test_document_action_cas.py'
      - '03_Implement/backend/tests/test_request_body_safety.py'
      - '03_Implement/backend/tests/test_tenant_session_precondition.py'
      - '03_Implement/frontend/src/api/**'
      - '03_Implement/frontend/src/canvas/**'
      - '03_Implement/frontend/src/domain/**'

permissions:
  contents: read

concurrency:
  group: sui-native-action-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 対象版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 検証対象を確認
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merge" = "$GITHUB_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "backend 対象版: $GITHUB_SHA"

      - name: Python 3.12を用意
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: バックエンド試験用依存関係を導入
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Action構文とデータ保存の回帰試験
        working-directory: 03_Implement/backend
        env:
          SUI_LLM_PROVIDER: none
        run: |
          python -m compileall -q src/sui_sensemaking_api/routes/docs.py src/sui_sensemaking_api/card_move_command.py src/sui_sensemaking_api/database_content_store.py
          python -m pytest -q tests/test_card_move_command.py tests/test_docs_roundtrip.py tests/test_document_action_cas.py tests/test_request_body_safety.py tests/test_tenant_session_precondition.py

  frontend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 対象版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 検証対象を確認
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Node.js 22を用意
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: 依存関係を固定版で導入
        working-directory: 03_Implement/frontend
        run: npm ci --no-audit --no-fund

      - name: 型とAction接続を検証
        working-directory: 03_Implement/frontend
        run: |
          npm run typecheck
          npm test -- src/api/client.test.ts src/api/tei_card_move_action.integration.test.ts src/domain/card_drag_commit.test.ts src/domain/confirmed_card_move_state.test.ts src/canvas/CardView.native_commit.test.ts
          node --experimental-strip-types --test src/api/tei_card_move_action.node-test.mjs
          npm run build
