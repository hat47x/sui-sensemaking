name: cognitive-assoc-baseline-harness-once

on:
  push:
    branches:
      - research/cognitive-assoc-01-baseline-harness-20260918
    paths:
      - .github/workflows/cognitive-assoc-baseline-harness-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify gated baseline harness
        working-directory: 01_Plans/dogfood
        run: |
          python -m unittest -v \
            test_freeze_cognitive_assoc_adjudication.py \
            test_run_cognitive_assoc_baselines.py

      - name: Verify plan command does not access fixed benchmark
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/baseline-plan.json"
          python 01_Plans/dogfood/run_cognitive_assoc_baselines.py plan --output "$plan"
          python - "$plan" <<'PY'
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert [b["id"] for b in value["baselines"]] == ["A", "C", "E"]
          gate = value["fixedBenchmarkRunGate"]
          assert gate["requiredAdjudicationState"] == "human_adjudication_frozen"
          assert gate["requiredEvidenceGate"] == "eligible_for_explicit_open"
          assert value["evaluationSeparation"]["rankingProduced"] is False
          assert value["evaluationSeparation"]["aggregateMetricProduced"] is False
          print("BASELINE_PLAN: VALID")
          print("FIXED_BENCHMARK_SEMANTIC_RUN: NOT_EXECUTED")
          PY

      - name: Verify no fixed benchmark run artifact was added
        run: |
          set -euo pipefail
          test ! -e 01_Plans/dogfood/cognitive-assoc-benchmark-v0-baseline-A.json
          test ! -e 01_Plans/dogfood/cognitive-assoc-benchmark-v0-baseline-C.json
          test ! -e 01_Plans/dogfood/cognitive-assoc-benchmark-v0-baseline-E.json

      - name: Documentation and diff checks
        run: |
          set -euo pipefail
          git diff --check
          set +e
          python 01_Plans/docs_check.py > "${RUNNER_TEMP}/docs-check.out" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat "${RUNNER_TEMP}/docs-check.out"
            python - "${RUNNER_TEMP}/docs-check.out" <<'PY'
          import pathlib
          import sys

          lines = [
              line.strip()
              for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if line.strip().startswith("- DC-")
          ]
          assert len(lines) == 2, lines
          assert all(
              "issue-SENSEMAKING-MODEL-01-semantic-artifact-persistence-boundary.md" in line
              and "Ready" in line
              for line in lines
          ), lines
          print("DOCS_CHECK: only two pre-existing main errors remain")
          PY
          fi
