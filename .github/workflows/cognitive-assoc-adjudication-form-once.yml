name: cognitive-assoc-adjudication-form-once

on:
  push:
    branches:
      - research/cognitive-assoc-01-adjudication-form-20260918
    paths:
      - .github/workflows/cognitive-assoc-adjudication-form-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify form generator unit tests
        working-directory: 01_Plans/dogfood
        run: |
          python -m unittest -v \
            test_build_cognitive_assoc_adjudication_form.py \
            test_freeze_cognitive_assoc_adjudication.py

      - name: Generate actual 63-case offline form from frozen sources
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/cognitive-assoc-form"
          frozen_root="$work/frozen-root"
          prepared="$work/prepared"
          mkdir -p "$frozen_root" "$prepared"

          python 01_Plans/dogfood/materialize_cognitive_assoc_frozen_sources.py \
            01_Plans/dogfood/cognitive-assoc-benchmark-v0-source-manifest.json \
            "$frozen_root" \
            --repo-root .

          python 01_Plans/dogfood/prepare_cognitive_assoc_benchmark.py \
            01_Plans/dogfood/cognitive-assoc-benchmark-v0-source-manifest.json \
            "$prepared" \
            --repo-root "$frozen_root"

          python 01_Plans/dogfood/build_cognitive_assoc_adjudication_form.py \
            01_Plans/dogfood/cognitive-assoc-benchmark-v0-pre-adjudication/selected-review-set.json \
            "$prepared/model-input.jsonl" \
            "$work/human-adjudication.html" \
            | tee "$work/form-build.out"

          grep -Fx "CANDIDATE_COUNT: 63" "$work/form-build.out"
          grep -Fx "NETWORK_ACCESS: NONE" "$work/form-build.out"
          grep -Fx "SEMANTIC_BASELINE_GATE: CLOSED" "$work/form-build.out"

          python - "$work/human-adjudication.html" <<'PY'
          import json
          import pathlib
          import sys

          page = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          selected = json.loads(pathlib.Path(
              "01_Plans/dogfood/cognitive-assoc-benchmark-v0-pre-adjudication/"
              "selected-review-set.json"
          ).read_text(encoding="utf-8"))

          candidate_ids = sorted(
              [x["id"] for x in selected["pairCandidates"]]
              + [x["id"] for x in selected["twoPlusOneCandidates"]]
          )
          assert len(candidate_ids) == 63
          assert all(candidate_id in page for candidate_id in candidate_ids)

          forbidden = [
              "selectionStrata",
              "sourceIslandId",
              '"similarity":',
              '"score":',
              '"activation":',
              '"confidence":',
              '"ranking":',
              '"modelOutput":',
              '"modelExplanation":',
              "http://",
              "https://",
              "<script src=",
              "<link ",
          ]
          for marker in forbidden:
              assert marker not in page, marker

          assert "Content-Security-Policy" in page
          assert "default-src 'none'" in page
          assert "human-adjudication-response.json" in page
          print("ACTUAL_FORM: VALID")
          print("CANDIDATE_COUNT: 63")
          print("NETWORK_ACCESS: NONE")
          PY

      - name: Documentation and diff checks
        run: |
          set -euo pipefail
          git diff --check
          set +e
          python 01_Plans/docs_check.py > "${RUNNER_TEMP}/docs-check.out" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat "${RUNNER_TEMP}/docs-check.out"
            python - "${RUNNER_TEMP}/docs-check.out" <<'PY'
          import pathlib
          import sys

          lines = [
              line.strip()
              for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if line.strip().startswith("- DC-")
          ]
          assert len(lines) == 2, lines
          assert all(
              "issue-SENSEMAKING-MODEL-01-semantic-artifact-persistence-boundary.md" in line
              and "Ready" in line
              for line in lines
          ), lines
          print("DOCS_CHECK: only two pre-existing main errors remain")
          PY
          fi
