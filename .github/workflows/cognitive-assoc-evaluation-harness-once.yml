name: cognitive-assoc-evaluation-harness-once

on:
  push:
    branches:
      - research/cognitive-assoc-01-evaluation-harness-20260918
    paths:
      - .github/workflows/cognitive-assoc-evaluation-harness-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify gated T4 evaluation harness
        working-directory: 01_Plans/dogfood
        run: |
          python -m unittest -v \
            test_freeze_cognitive_assoc_adjudication.py \
            test_run_cognitive_assoc_baselines.py \
            test_evaluate_cognitive_assoc_baselines.py

      - name: Verify fixed v0 was not executed
        run: |
          set -euo pipefail
          find 01_Plans/dogfood -maxdepth 2 -type f \
            \( -name 'cognitive-assoc-benchmark-v0-probe-*.json' \
            -o -name 'cognitive-assoc-benchmark-v0-evaluation-summary.json' \) \
            -print -quit | grep -q . && {
              echo "fixed v0 evaluation artifact must not exist before T2d freeze"
              exit 1
            } || true

      - name: Documentation and diff checks
        run: |
          set -euo pipefail
          git diff --check
          set +e
          python 01_Plans/docs_check.py > "${RUNNER_TEMP}/docs-check.out" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat "${RUNNER_TEMP}/docs-check.out"
            python - "${RUNNER_TEMP}/docs-check.out" <<'PY'
          import pathlib
          import sys

          lines = [
              line.strip()
              for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if line.strip().startswith("- DC-")
          ]
          assert len(lines) == 2, lines
          assert all(
              "issue-SENSEMAKING-MODEL-01-semantic-artifact-persistence-boundary.md" in line
              and "Ready" in line
              for line in lines
          ), lines
          print("DOCS_CHECK: only two pre-existing main errors remain")
          PY
          fi

# rerun: synthetic label expectation fixed
