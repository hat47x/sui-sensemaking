name: SUI バックエンド全テスト（定期）

# PRのCIは安全不変条件に関係するテストを明示的に選ぶ。選ばれなかった
# バックエンドテストは、ここで毎日まとめて実行し、後退を翌日までに検出する。
# Issue #3303: どのテストをPRの必須にし、どれを定期実行に残すかを分ける。
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sui-backend-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 対象版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Python 3.12を用意
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: バックエンドの依存を導入
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: 契約ドリフトと全テスト
        working-directory: 03_Implement/backend
        env:
          SUI_LLM_PROVIDER: none
        run: |
          python scripts/check_contract_drift.py
          python -m pytest -q
