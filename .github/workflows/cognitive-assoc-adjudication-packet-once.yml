name: cognitive-assoc-adjudication-packet-once

on:
  push:
    branches:
      - research/cognitive-assoc-01-adjudication-packet-20260918
    paths:
      - .github/workflows/cognitive-assoc-adjudication-packet-once.yml

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify generator tests
        working-directory: 01_Plans/dogfood
        run: |
          python -m unittest -v \
            test_materialize_cognitive_assoc_frozen_sources.py \
            test_prepare_cognitive_assoc_benchmark.py \
            test_select_cognitive_assoc_adjudication_set.py \
            test_build_cognitive_assoc_adjudication_packet.py

      - name: Generate model-blind pre-adjudication artifacts
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/cognitive-assoc-v0"
          out="01_Plans/dogfood/cognitive-assoc-benchmark-v0-pre-adjudication"
          rm -rf "$work" "$out"
          frozen_root="$work/frozen-root"
          mkdir -p "$work" "$out" "$frozen_root"

          python 01_Plans/dogfood/materialize_cognitive_assoc_frozen_sources.py \
            01_Plans/dogfood/cognitive-assoc-benchmark-v0-source-manifest.json \
            "$frozen_root" \
            --repo-root .

          python 01_Plans/dogfood/prepare_cognitive_assoc_benchmark.py \
            01_Plans/dogfood/cognitive-assoc-benchmark-v0-source-manifest.json \
            "$work/prepared" \
            --repo-root "$frozen_root"

          python 01_Plans/dogfood/select_cognitive_assoc_adjudication_set.py \
            "$work/prepared/model-input.jsonl" \
            "$work/prepared/contrast-pool.json" \
            "$out/selected-review-set.json"

          python 01_Plans/dogfood/build_cognitive_assoc_adjudication_packet.py \
            "$work/prepared/model-input.jsonl" \
            "$out/selected-review-set.json" \
            "$out/human-adjudication-packet.md"

          python - "$work" "$out" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          work = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          model_path = work / "prepared/model-input.jsonl"
          pool_path = work / "prepared/contrast-pool.json"
          selected_path = out / "selected-review-set.json"
          packet_path = out / "human-adjudication-packet.md"
          manifest_path = pathlib.Path("01_Plans/dogfood/cognitive-assoc-benchmark-v0-source-manifest.json")

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          model_count = sum(1 for line in model_path.read_text(encoding="utf-8").splitlines() if line.strip())
          pool = json.loads(pool_path.read_text(encoding="utf-8"))
          selected = json.loads(selected_path.read_text(encoding="utf-8"))
          pair_count = len(selected["pairCandidates"])
          triple_count = len(selected["twoPlusOneCandidates"])
          total = pair_count + triple_count

          assert model_count == 29, model_count
          assert len(pool["pairCandidates"]) == 173
          assert len(pool["twoPlusOneCandidates"]) == 346
          assert pool["semanticBaselineGate"] == "closed"
          assert selected["semanticBaselineGate"] == "closed"
          assert selected["modelOutputsAllowed"] is False
          assert 32 <= total <= 64, total
          assert all(c["label"] == "pending_human" for c in selected["pairCandidates"] + selected["twoPlusOneCandidates"])

          packet = packet_path.read_text(encoding="utf-8")
          for forbidden in (
              "selectionStrata", "sourceIslandId", "islandTitle", "semantic score",
              '"similarity"', '"activation"', '"confidence"', '"ranking"',
              "modelOutput", "modelExplanation",
          ):
              if forbidden in packet:
                  raise AssertionError(f"human packet leaks forbidden marker: {forbidden}")

          evidence = {
              "schema": "sui.cognitive-assoc-pre-adjudication-evidence/v1",
              "benchmarkId": selected["benchmarkId"],
              "generatedAt": "2026-09-18",
              "state": "human_adjudication_packet_generated",
              "semanticBaselineGate": "closed",
              "modelOutputsAllowed": False,
              "humanJudgementsPresent": False,
              "sourceManifestGitBlobSha": "57c681f039262436c835e6fd4416f814519516fa",
              "counts": {
                  "modelInputCards": model_count,
                  "fullPairCandidates": len(pool["pairCandidates"]),
                  "fullTwoPlusOneCandidates": len(pool["twoPlusOneCandidates"]),
                  "selectedPairCandidates": pair_count,
                  "selectedTwoPlusOneCandidates": triple_count,
                  "selectedTotal": total,
              },
              "sha256": {
                  "ephemeralModelInput": sha256(model_path),
                  "ephemeralFullContrastPool": sha256(pool_path),
                  "selectedReviewSet": sha256(selected_path),
                  "humanAdjudicationPacket": sha256(packet_path),
              },
              "selectionProtocol": selected["selectionProtocol"],
              "nextRequiredGate": "Maintainer must complete model-blind human adjudication and freeze the adjudicated artifact before any semantic baseline is run.",
          }
          (out / "generation-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Verify no fixed semantic baseline was invoked
        run: |
          set -euo pipefail
          ! grep -R "semanticBaselineGate.*open" 01_Plans/dogfood/cognitive-assoc-benchmark-v0-pre-adjudication
          grep -R '"label": "pending_human"' 01_Plans/dogfood/cognitive-assoc-benchmark-v0-pre-adjudication/selected-review-set.json >/dev/null

      - name: Documentation and diff checks
        run: |
          python 01_Plans/docs_check.py
          git diff --check

      - name: Commit generated artifacts to the working branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Plans/dogfood/cognitive-assoc-benchmark-v0-pre-adjudication
          git commit -m "research(cognitive): human adjudication packetを凍結する"
          git push origin HEAD:research/cognitive-assoc-01-adjudication-packet-20260917
